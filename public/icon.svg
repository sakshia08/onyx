<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Onyx app icon: the pig (PRD §10.6), filled with pink liquid, on near-black.
    Same shapes as src/components/PigIllustration.tsx, drawn static and a little bolder
    so it reads at small sizes. The pig sits inside the central 80% (maskable safe zone).
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fill" x1="0" y1="42" x2="0" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8fb8" />
      <stop offset="1" stop-color="#ff5fa2" />
    </linearGradient>
    <clipPath id="inside">
      <ellipse cx="118" cy="110" rx="84" ry="62" />
      <ellipse cx="203" cy="114" rx="13" ry="18" />
    </clipPath>
    <mask id="outside-body">
      <rect x="-20" y="-20" width="280" height="250" fill="white" />
      <ellipse cx="118" cy="110" rx="84" ry="62" fill="black" />
    </mask>
    <mask id="outside-snout">
      <rect x="-20" y="-20" width="280" height="250" fill="white" />
      <ellipse cx="203" cy="114" rx="13" ry="18" fill="black" />
    </mask>
  </defs>

  <rect width="512" height="512" fill="#09090b" />
  <rect width="512" height="512" fill="url(#glow)" />

  <g transform="translate(66 92) scale(1.58)" stroke-linecap="round" stroke-linejoin="round">
    <g mask="url(#outside-body)" fill="none" stroke="#ff5fa2" stroke-width="3">
      <g opacity="0.5">
        <path d="M 90 140 V 175 Q 90 182 97 182 H 100 Q 107 182 107 175 V 140" />
        <path d="M 154 140 V 175 Q 154 182 161 182 H 164 Q 171 182 171 175 V 140" />
      </g>
      <path d="M 66 140 V 175 Q 66 182 73 182 H 76 Q 83 182 83 175 V 140" />
      <path d="M 130 140 V 175 Q 130 182 137 182 H 140 Q 147 182 147 175 V 140" />
    </g>

    <path d="M 36 102 C 25 103 17 96 20 88 C 23 80 34 81 34 88 C 34 95 25 96 22 91" fill="none" stroke="#ff5fa2" stroke-width="3" />

    <ellipse cx="118" cy="110" rx="84" ry="62" fill="#ff8fb8" opacity="0.08" />

    <g clip-path="url(#inside)">
      <path d="M -20 89 Q -2 85 16 89 T 52 89 T 88 89 T 124 89 T 160 89 T 196 89 T 232 89 V 240 H -20 Z" fill="#ff8fb8" opacity="0.45" />
      <path d="M -20 93 Q -6 89.5 8 93 T 36 93 T 64 93 T 92 93 T 120 93 T 148 93 T 176 93 T 204 93 T 232 93 V 240 H -20 Z" fill="url(#fill)" />
    </g>

    <path d="M 144 62 C 140 46 148 31 160 29 C 170 27 176 36 176 48 C 176 57 178 65 182 72 Z" mask="url(#outside-body)" fill="#ff8fb8" fill-opacity="0.18" stroke="#ff5fa2" stroke-width="3" />

    <ellipse cx="118" cy="110" rx="84" ry="62" fill="none" stroke="#ff5fa2" stroke-width="3" mask="url(#outside-snout)" />

    <ellipse cx="203" cy="114" rx="13" ry="18" fill="#ff8fb8" fill-opacity="0.14" stroke="#ff5fa2" stroke-width="3" />
    <ellipse cx="198.5" cy="114" rx="2.4" ry="3.8" fill="#ff5fa2" />
    <ellipse cx="207.5" cy="114" rx="2.4" ry="3.8" fill="#ff5fa2" />

    <rect x="102" y="54.5" width="30" height="6" rx="3" fill="#ff5fa2" />

    <path d="M 58 80 C 66 70 77 63 89 59" fill="none" stroke="#f5f5f7" stroke-opacity="0.4" stroke-width="3" />

    <circle cx="172" cy="90" r="6" fill="#ff5fa2" />
    <circle cx="174.2" cy="87.8" r="2" fill="#f5f5f7" />
    <ellipse cx="178" cy="113" rx="8" ry="5" fill="#ff5fa2" opacity="0.45" />
  </g>
</svg>
